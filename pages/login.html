<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Ayuda a un Tercero</title>
    <link rel="stylesheet" href="../assets/css/styles-new.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Adaptación de colores del sistema a la estructura de login */
            --auth-primary: var(--primary-blue);
            --auth-accent: var(--accent-orange);
            --auth-bg-gradient: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-mid));
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--auth-bg-gradient);
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        /* Efecto de fondo sutil */
        .auth-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            top: -25%;
            left: -25%;
            pointer-events: none;
        }

        .auth-card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            padding: 40px 24px 20px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--auth-bg-gradient);
            color: white;
            margin-bottom: 20px;
            box-shadow: var(--shadow-accent);
        }

        .auth-title {
            color: var(--primary-blue);
            font-weight: 800;
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #E5E7EB;
            background: #F9FAFB;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 18px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font-body);
        }

        .auth-tab:hover {
            color: var(--primary-blue);
        }

        .auth-tab.active {
            color: var(--primary-blue);
            border-bottom-color: var(--accent-orange);
            background: white;
        }

        .auth-body {
            padding: 40px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #F3F4F6;
            border-radius: var(--radius-md);
            font-family: var(--font-body);
            font-size: 1rem;
            transition: var(--transition);
            background: #F9FAFB;
        }

        .form-control:focus {
            border-color: var(--accent-orange);
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 127, 50, 0.1);
        }

        .form-link {
            font-size: 0.875rem;
            color: var(--primary-blue-mid);
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            display: block;
            margin-top: 10px;
            text-decoration: none;
        }

        .form-link:hover {
            color: var(--accent-orange);
            text-decoration: underline;
        }

        .btn-block {
            width: 100%;
            margin-top: 10px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 30px;
            opacity: 0.8;
            transition: var(--transition);
        }

        .back-link:hover {
            opacity: 1;
            transform: translateX(-5px);
        }

        @media (max-width: 600px) {
            .auth-body {
                padding: 30px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div style="width: 100%; max-width: 500px;">
            <a href="../index.html" class="back-link">
                <i data-lucide="arrow-left" size="20"></i> Volver al inicio
            </a>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <i data-lucide="heart" size="32"></i>
                    </div>
                    <h2 class="auth-title">Bienvenido</h2>
                    <p class="auth-subtitle">Conecta. Apoya. Transforma vidas.</p>
                </div>

                <!-- Pestañas -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar Sesión</button>
                    <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Crear Cuenta</button>
                </div>

                <div class="auth-body">
                    <!-- Formulario Iniciar Sesión -->
                    <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="tu@correo.com"
                                required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••"
                                required>
                            <a class="form-link" onclick="switchTab('recovery')">¿Olvidaste tu contraseña?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block">Ingresar</button>
                    </form>

                    <!-- Formulario Registro -->
                    <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" placeholder="Ej. María Sánchez" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" placeholder="809-000-0000" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ubicación</label>
                                <input type="text" class="form-control" placeholder="Ej. Monte Plata" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Quiero unirme como:</label>
                            <select id="registerRole" class="form-control" required
                                style="appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23667085%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px;">
                                <option value="" disabled selected>Selecciona tu perfil...</option>
                                <option value="donador">❤️ Donador</option>
                                <option value="beneficiario">🙌 Beneficiario</option>
                                <option value="emprendedor">🚀 Emprendedor (Marketplace)</option>
                                <option value="comprador">🛍️ Comprador Solidario</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" placeholder="tu@correo.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="Crea una contraseña segura"
                                required>
                        </div>
                        <button type="submit" class="btn btn-accent btn-lg btn-block">Registrarme Gratis</button>
                    </form>

                    <!-- Formulario Recuperar Contraseña -->
                    <form id="form-recovery" class="auth-form" onsubmit="handleRecovery(event)">
                        <h3 style="font-size: 1.25rem; margin-bottom: 12px; color: var(--primary-blue);">Recuperar
                            acceso</h3>
                        <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 24px;">Ingresa tu correo
                            electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" placeholder="tu@correo.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block">Enviar instrucciones</button>
                        <a class="form-link" style="text-align: center; margin-top: 20px;"
                            onclick="switchTab('login')">Volver al inicio de sesión</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Iconos
        lucide.createIcons();

        function switchTab(tabId) {
            // Eliminar active de todos los tabs y forms
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            // Activar el correspondiente
            document.getElementById('form-' + tabId).classList.add('active');

            // Si es login o register, activar su pestaña visual
            if (tabId === 'login' || tabId === 'register') {
                document.getElementById('tab-' + tabId).classList.add('active');
            }
        }

        // --- SISTEMA DE LOGUEO Y REGISTRO ---
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.toLowerCase();

            if (email === 'admin' || email === 'admin@ayudatercero.com') {
                localStorage.setItem('userRole', 'Admin');
                localStorage.setItem('userName', 'SuperAdministrador');
                window.location.href = 'admin.html';
            } else {
                let role = localStorage.getItem('userRole') || 'Usuario';
                localStorage.setItem('userRole', role);
                localStorage.setItem('userName', 'Usuario Plataforma');

                alert(`¡Bienvenido de nuevo!\nHas iniciado sesión como ${role}.`);
                window.location.href = 'perfil.html';
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const rolSelect = document.getElementById('registerRole');
            const rolActivo = rolSelect.options[rolSelect.selectedIndex].text;

            localStorage.setItem('userRole', rolActivo);
            localStorage.setItem('userName', 'Nuevo Miembro');

            alert(`¡Verificación enviada!\nPor favor revisa tu correo para verificar tu nueva cuenta de ${rolActivo}.`);
            window.location.href = 'perfil.html';
        }

        function handleRecovery(event) {
            event.preventDefault();
            alert('Se ha enviado un enlace de recuperación a tu correo electrónico.');
            switchTab('login');
        }
    </script>
    <script src="../assets/js/accessibility.js"></script>
</body>

</html>
